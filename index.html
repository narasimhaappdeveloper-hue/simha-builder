<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMHA UI Engine</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .app {
      max-width: 600px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 20px #00000012;
    }

    h1 {
      color: #075985;
      font-size: 26px;
    }

    .description {
      color: #64748b;
      line-height: 1.6;
    }

    .counter {
      margin: 20px 0;
      padding: 20px;
      background: #e0f2fe;
      border-radius: 12px;
      text-align: center;
    }

    #count {
      display: block;
      margin: 10px;
      font-size: 42px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 9px;
      background: #0369a1;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    #message {
      min-height: 24px;
      margin-top: 18px;
      color: #047857;
    }

    .footer {
      margin-top: 24px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <main class="app" id="app"></main>

  <script>
    // SIMHA UI Engine — Version 0.1

    const SimhaUI = {
      mount(target, component) {
        const element = document.querySelector(target);

        if (!element) {
          throw new Error("SIMHA UI: Target not found");
        }

        this.render(element, component);
      },

      render(element, component) {
        element.replaceChildren();

        const view = component();

        if (view instanceof Node) {
          element.appendChild(view);
        }
      },

      element(tag, text, className) {
        const node = document.createElement(tag);

        if (text !== undefined) {
          node.textContent = text;
        }

        if (className) {
          node.className = className;
        }

        return node;
      }
    };

    // Application state
    const state = {
      count: 0
    };

    // Build the UI using our own engine
    function App() {
      const container = document.createElement("div");

      const title = SimhaUI.element(
        "h1",
        "SIMHA UI Engine"
      );

      const description = SimhaUI.element(
        "p",
        "మన సొంత Frontend Technology నిర్మాణానికి ఇది మొదటి అడుగు.",
        "description"
      );

      const counter = SimhaUI.element(
        "section",
        undefined,
        "counter"
      );

      counter.appendChild(
        SimhaUI.element("p", "Button నొక్కిన సంఖ్య")
      );

      const count = SimhaUI.element(
        "span",
        String(state.count)
      );

      count.id = "count";

      counter.appendChild(count);

      const button = SimhaUI.element(
        "button",
        "Count పెంచండి"
      );

      button.addEventListener("click", () => {
        state.count++;
        SimhaUI.mount("#app", App);

        document.querySelector("#message").textContent =
          "SIMHA UI ద్వారా UI నవీకరించబడింది!";
      });

      const reset = SimhaUI.element(
        "button",
        "మళ్లీ ప్రారంభించండి"
      );

      reset.style.background = "#475569";

      reset.addEventListener("click", () => {
        state.count = 0;
        SimhaUI.mount("#app", App);
      });

      const message = SimhaUI.element("p", "");
      message.id = "message";

      const footer = SimhaUI.element(
        "div",
        "SIMHA Technologies • Prototype 0.1",
        "footer"
      );

      container.append(
        title,
        description,
        counter,
        button,
        reset,
        message,
        footer
      );

      return container;
    }

    // Start our UI engine
    SimhaUI.mount("#app", App);
  </script>
</body>
</html>
